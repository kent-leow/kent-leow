name: Security & Dependencies

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  push:
    branches: [main]
    paths: ['package.json', 'yarn.lock']
  pull_request:
    paths: ['package.json', 'yarn.lock']

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Yarn audit
        run: yarn audit --level moderate
        continue-on-error: true

      - name: Run npm audit
        run: npm audit --audit-level moderate
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, BSD-2-Clause

  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update dependencies
        run: |
          yarn upgrade --latest
          yarn dedupe

      - name: Run tests
        run: yarn test --passWithNoTests --watchAll=false

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: '🔄 Weekly Dependency Updates'
          body: |
            ## 🔄 Automated Dependency Updates
            
            This PR contains automated dependency updates for the week.
            
            ### Changes
            - Updated all dependencies to latest versions
            - Ran deduplication to optimize package tree
            - All tests pass successfully
            
            ### Review Checklist
            - [ ] Review updated dependencies for breaking changes
            - [ ] Verify application functionality
            - [ ] Check for any security vulnerabilities
            
            **Auto-generated by GitHub Actions**
          branch: chore/dependency-updates
          delete-branch: true
          draft: false
